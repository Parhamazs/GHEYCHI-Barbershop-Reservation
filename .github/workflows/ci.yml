name: CI/CD Pipeline - Gheychi (قیچی)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    name: Backend Lint, Test & Build (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gheychi_user
          POSTGRES_PASSWORD: gheychi_secret
          POSTGRES_DB: gheychi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: go test -v -race ./...

      - name: Compile Backend Binary
        working-directory: ./backend
        run: CGO_ENABLED=0 go build -v -o gheychi-api ./cmd/api

  frontend-lint-test-build:
    name: Frontend Lint, Test & Build (React)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Check / Lint
        run: npm run lint

      - name: Build Production Frontend
        run: npm run build

  docker-build-verification:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gheychi-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gheychi-frontend:ci
